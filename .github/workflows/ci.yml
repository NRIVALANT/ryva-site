name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Hors production : le garde-fou de contenu informe sans bloquer.
      - run: npm run build
      # Règles de CLAUDE.md sur le code et sur le HTML généré : couleurs en dur, px, hiérarchie de titres,
      # images sans alt, ancres cassées, noindex. À lancer après le build.
      - run: npm run check:qualite
