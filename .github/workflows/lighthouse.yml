name: Lighthouse CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # @lhci/cli via npx : aucune dépendance ajoutée à package.json.
      - run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
